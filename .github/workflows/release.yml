name: Release & Multi-Platform Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.0.0)"
        required: false
        default: "v2.0.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Application with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag || 'v2.0.0' }}
          releaseName: "Google Tasks Pro ${{ github.ref_name || inputs.release_tag || 'v2.0.0' }}"
          args: --target ${{ matrix.target }}
          releaseBody: |
            ## 🚀 Google Tasks Pro Release

            ### ✨ What's New in v2.0.0:
            * **AI Multi-Model Catalog & Reasoning Switcher:** Support for cutting-edge models (Gemini 3.8 Flash, Gemini 3.5 Flash, Gemini 3.1 Pro, Claude 3.7 Sonnet, o3-mini, DeepSeek R1) with instant Thinking toggle for near-instant answers.
            * **Intra-Provider Auto-Backup Failover:** Automatic fallback between sub-models or providers when quota limits (429) or high demand spikes occur.
            * **Full List CRUD Management:** Create, rename, and delete task lists natively with confirmation safeguards and markdown tables rendering.
            * **Guest / Offline Mode:** Instant local task workspace without requiring a Google sign-in.
            * **Multi-Account Switcher:** 1-click switching between multiple saved Google accounts and Guest mode.
            * **Cloud Sync:** Seamlessly merge and upload local guest tasks to Google Tasks upon signing in.
            * **Native macOS OAuth Auto-Focus:** Automatically brings Google Tasks Pro to the foreground when authentication completes.
            * **One-Click Eisenhower Matrix:** Prioritize tasks directly in the quick-add bar.
            * **Custom Due Times:** Precise hours and minutes with native system notifications.
            * **Smart Recurring Tasks Engine:** Multi-interval repetition (Daily/Weekly/Monthly) with auto-spawn.
            * **Background Mode & System Tray:** Keeps running in the menu bar with zero CPU impact.
            * **Full Arabic & English Internationalization:** Native RTL mirroring and static themes.
            * **Offline-First Synchronization:** Local snapshots and automatic sync queue.

            ### 🍏 macOS Installation Note:
            If macOS shows *"Google Tasks Pro is damaged and can't be opened"*, run this one-time command in your Terminal:
            ```bash
            xattr -cr "/Applications/Google Tasks Pro.app"
            ```
            Or navigate to **System Settings ➔ Privacy & Security ➔ Open Anyway**.

            Download the installer for your operating system below!
          releaseDraft: false
          prerelease: false
