name: Release & Multi-Platform Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.2.0)"
        required: false
        default: "v2.2.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Application with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag || 'v2.2.0' }}
          releaseName: "Google Tasks Pro ${{ github.ref_name || inputs.release_tag || 'v2.2.0' }}"
          args: --target ${{ matrix.target }}
          releaseBody: |
            ## 🚀 Google Tasks Pro v2.2.0 Release

            ### ✨ What's New in v2.2.0:
            * **🔍 Universal Date & Status Filtering Across All Tabs:** Filter tasks by due date (All Dates, Today, This Week, This Month) and status (Pending, Overdue, Completed, All) seamlessly synchronized across Board, List, and Eisenhower views.
            * **🎛️ Ultra-Compact Toolbar & Options Popover:** Redesigned filter toolbar into a sleek, 1-line search bar saving over 100px of vertical height on mobile and desktop, with a dedicated filter popover and removable active filter pills.
            * **📂 Collapsible Lists & Accordions:** Smooth animated collapsing/expanding for individual lists with persistent localStorage state and a global Expand/Collapse All toggle in List view.
            * **⏰ Overdue Task Highlighting:** Overdue tasks are prominently badged in error-red across cards, columns, and matrix quadrants.
            * **🧩 Smarter Eisenhower Matrix:** Clean parent context headers for cross-quadrant subtasks and automatic quadrant inheritance for untagged subtasks.
            * **🔐 Rock-Solid AI Settings Persistence:** Direct encryption to local CryptoVault with localStorage fallback ensuring API keys and model choices are never lost across restarts.
            * **💬 AI Copilot UX Enhancements:** Optimized copy button in assistant message footer and interactive Retry recovery buttons for failed requests.
            * **🌐 Full Bilingual Internationalization:** 100% dictionary coverage with zero hardcoded strings, supporting seamless English and Arabic toggling.

            ### 🍏 macOS Installation Note:
            If macOS shows *"Google Tasks Pro is damaged and can't be opened"*, run this one-time command in your Terminal:
            ```bash
            xattr -cr "/Applications/Google Tasks Pro.app"
            ```
            Or navigate to **System Settings ➔ Privacy & Security ➔ Open Anyway**.

            Download the installer or APK for your platform below!
          releaseDraft: false
          prerelease: false

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;26.3.11579264"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Universal Android APK
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "Using NDK_HOME=$NDK_HOME"
          ls -d "$NDK_HOME"
          npx tauri android build --apk --target aarch64 --target armv7

      - name: Prepare APK Asset
        run: |
          TAG="${{ github.ref_name || inputs.release_tag || 'v2.2.0' }}"
          mkdir -p release-apk
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "release-apk/GoogleTasksPro_${TAG}_universal.apk"
          ls -la release-apk/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag || 'v2.2.0' }}
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
