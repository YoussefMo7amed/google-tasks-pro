<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Google Tasks Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
      body {
        margin: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Polyfills for older Android System WebViews (e.g. Chrome 78 on Android 7-9)
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function (str, newStr) {
          if (Object.prototype.toString.call(str).toLowerCase() === "[object regexp]") {
            return this.replace(str, newStr);
          }
          return this.split(str).join(newStr);
        };
      }
      if (!Array.prototype.at) {
        Array.prototype.at = function (n) {
          n = Math.trunc(n) || 0;
          if (n < 0) n += this.length;
          if (n < 0 || n >= this.length) return undefined;
          return this[n];
        };
      }
      if (!Object.hasOwn) {
        Object.hasOwn = function (obj, prop) {
          return Object.prototype.hasOwnProperty.call(obj, prop);
        };
      }
      if (typeof crypto !== "undefined" && !crypto.randomUUID) {
        crypto.randomUUID = function () {
          return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
            var r = crypto.getRandomValues(new Uint8Array(1))[0];
            return (c ^ ((r & 15) >> (c / 4))).toString(16);
          });
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
